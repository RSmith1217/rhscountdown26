name: Update RHS Absences

on:
  workflow_dispatch:
  schedule:
    # Twelve morning attempts, offset from the busy top of the hour.
    - cron: "3,13,23,33,43,53 7-8 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: rhs-absence-refresh
  cancel-in-progress: false

jobs:
  update-absences:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the school calendar
        id: calendar
        run: python scripts/absence_schedule.py

      - name: Scrape RHS App absences
        if: steps.calendar.outputs.refresh == 'true'
        run: python scripts/update_absences.py

      - name: Commit updated absence data
        if: steps.calendar.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add absences.json
          git diff --cached --quiet || git commit -m "Update absence data"
          git push
